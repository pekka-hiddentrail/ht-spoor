# SPA fallback for the Sauce Demo storefront.
#
# The app uses client-side (BrowserRouter) routing, so a direct request for a
# route like /inventory.html must return index.html and let the JS bundle render
# the route. Authentication is a client-side cookie the SPA reads (`session-username`),
# so nginx serves every route identically — the login gating happens in the browser,
# not the server. That is exactly what makes it a two-sided test: the static tier
# carries the cookie but still sees only the app shell, and the browser tier renders
# the gated inventory.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
