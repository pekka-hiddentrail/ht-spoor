name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Cache the pip download/wheel cache, keyed on the dependency spec.
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Cache Playwright browser (tier 2)
        uses: actions/cache@v4
        with:
          # The Chromium download is the single biggest gate step; cache it so a
          # hit skips the download (the `--with-deps` apt step still runs, but is
          # fast on the runner image). Keyed on the pinned playwright version.
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install browser (tier 2)
        run: python -m playwright install --with-deps chromium
      - name: Cache Juice Shop image (§5.1)
        uses: actions/cache@v4
        with:
          # Cache the pinned archetype image as a tarball so the bench boot skips
          # the registry pull on a hit. Key is the tag — bumping it invalidates.
          path: /tmp/juice-shop-image.tar
          key: juice-shop-image-v17.1.1
      - name: Load or pull Juice Shop image
        run: |
          if [ -f /tmp/juice-shop-image.tar ]; then
            docker load -i /tmp/juice-shop-image.tar
          else
            docker compose -f fixtures/docker-compose.yml pull
            docker save bkimminich/juice-shop:v17.1.1 -o /tmp/juice-shop-image.tar
          fi
      - name: Start archetype bench (Juice Shop, §5.1)
        run: docker compose -f fixtures/docker-compose.yml up -d
      - name: Wait for Juice Shop to be ready
        # Poll the port from outside (the image is distroless — no in-container
        # probe), so the integration test finds a ready app instead of racing
        # the boot.
        run: timeout 180 bash -c 'until curl -sf http://127.0.0.1:3000/ >/dev/null; do sleep 3; done'
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy .
      - name: Tests (unit, .feature scenarios, golden-master, integration)
        # The integration test skips when the container is unreachable; here it
        # is up, so the Juice Shop end-to-end (§5.1) runs as part of the gate.
        run: pytest
      - name: Upload extraction output
        # The E2E run writes its extracted records here; keep them out of a temp
        # folder and downloadable from the run page, especially on a golden-master
        # mismatch (hence always()).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-output
          path: test-output/
          if-no-files-found: ignore
      - name: Genericity (§0)
        run: python scripts/check_genericity.py
      - name: Stop archetype bench
        if: always()
        run: docker compose -f fixtures/docker-compose.yml down
