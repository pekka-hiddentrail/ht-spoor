name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install browser (tier 2)
        run: python -m playwright install --with-deps chromium
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy .
      - name: Tests (unit, .feature scenarios, golden-master)
        run: pytest
      - name: Genericity (§0)
        run: python scripts/check_genericity.py
