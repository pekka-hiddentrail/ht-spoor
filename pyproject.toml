# Distribution name is `ht-spoor` (plain `spoor` is taken on PyPI); the
# project, brand, import package and CLI all stay `spoor`. See ROADMAP.md §4
# Phase 0 and §8.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ht-spoor"
version = "0.0.0"
description = "Give your agents a map of the web — a local-first crawler that escalates from selectors to browser and visual interaction only when needed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hidden Trail" }]
keywords = ["scraping", "crawler", "playwright", "mcp", "api-discovery"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Development Status :: 2 - Pre-Alpha",
]
# Runtime deps are added phase by phase (ROADMAP.md §7). Phase 0 keeps only
# what the CLI surface and config validation need; browser/crawl stacks arrive
# with Phase 1.
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-bdd",
    "pytest-cov",
    "hypothesis",
]

[project.scripts]
spoor = "spoor.cli:app"

[tool.hatch.build.targets.wheel]
# Import package stays `spoor` even though the distribution is `ht-spoor`.
packages = ["spoor"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Gherkin .feature files live under features/ (ROADMAP.md §4a, pytest-bdd).
bdd_features_base_dir = "features"
markers = [
    "mutation: tier-3 mutation corpus (ROADMAP.md §5.3) — success rate must stay >= 95%",
]
